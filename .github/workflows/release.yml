name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build from this commit (without v)
        required: true
        default: '0.1.12'
        type: string
      publish:
        description: Publish after verification (version tag must point at this commit)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      source: ${{ steps.plan.outputs.source }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and source tag
        id: plan
        env:
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
        run: python3 scripts/release-plan.py
      - name: Test packaging and publishing scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, os: windows, arch: amd64, goarch: x64}
          - {runner: ubuntu-24.04, os: linux, arch: amd64, goarch: x64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, goarch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64, goarch: x64}
          - {runner: macos-15, os: darwin, arch: arm64, goarch: arm64}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      CGO_CFLAGS: ${{ matrix.os == 'darwin' && '-mmacosx-version-min=13.0' || '' }}
      CGO_LDFLAGS: ${{ matrix.os == 'darwin' && '-mmacosx-version-min=13.0' || '' }}
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          architecture: ${{ matrix.goarch }}
      - name: Linux build and desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libx11-xcb1 libxcb1 libxkbcommon0 libxkbcommon-x11-0 libvulkan1 mesa-vulkan-drivers fonts-noto-cjk libudev1 dpkg-dev binutils
      - name: Validate architecture and module integrity
        run: |
          test "$(go env GOARCH)" = '${{ matrix.arch }}'
          go mod download
          git diff --exit-code -- go.mod go.sum
      - name: Go tests
        run: go test ./...
      - name: Go static analysis
        run: go vet ./...
      - name: Native packaging tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build fresh native packages and installers
        run: go run ./cmd/package --version "$PACKAGE_VERSION" --commit "$SOURCE_COMMIT" --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ needs.prepare.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/*.deb
            dist/*.verification.json
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
  verify:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-${{ needs.prepare.outputs.version }}-*
          merge-multiple: true
          path: release
      - name: Verify all nine fresh packages and prepare release notes
        run: python3 scripts/verify-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release-${{ needs.prepare.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [prepare, verify]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-${{ needs.prepare.outputs.version }}
          path: release
      - name: Stage assets in a draft and publish only after upload verification
        run: python3 scripts/publish-release.py
